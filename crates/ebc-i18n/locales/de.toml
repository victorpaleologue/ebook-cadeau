# German (de-DE; also de-AT, de-CH) — eBook Cadeau interface strings.
#
# Source: docs/research/06-terminology.md, §5.1 and §5.2 for the keys listed there; the
# rest was drafted to the same rules. NOT yet reviewed by a native bookseller (§6).
# Rules for editors: see fr.toml, plus:
#   * no second-person pronoun anywhere (neither du nor Sie): infinitive instructions;
#     only `card_headline_formal` / `card_headline_informal` carry one, by design;
#   * no "ß" in any string, so that de-CH needs no variant;
#   * "einlösen" appears only in `meta_*` and `help_*` keys.

