# English (en-GB, en-IE) — eBook Cadeau interface strings.
#
# Source: docs/research/06-terminology.md, §5.1 and §5.2 for the keys listed there; the
# rest was drafted to the same rules. NOT yet reviewed by a native bookseller (§6).
# Rules for editors: see fr.toml. "Redeem" appears only in `meta_*` and `help_*` keys.

