# French (fr-FR; also fr-BE, fr-CH, fr-LU) — eBook Cadeau interface strings.
#
# Source: docs/research/06-terminology.md, §5.1 and §5.2 for the keys listed there; the
# rest was drafted to the same rules. NOT yet reviewed by a native bookseller (§6).
#
# Rules for editors (enforced by `cargo test -p ebc-i18n`):
#   * no stored-value word (carte cadeau, chèque cadeau, bon d'achat…): see src/lint.rs;
#   * the printed card uses the infinitive and no pronoun; screens address the reader
#     with "vous"; buttons are in the first person;
#   * a no-break space, written  , before ? ! : ; — typographic apostrophe ’;
#   * `{placeholders}` must be the same in every language file;
#   * the card never says "QR": printed steps say « ce code ».

[meta]
language = "fr-FR"
review = "unreviewed"   # unreviewed | provisional | reviewed
reviewed_by = ""

[strings]
