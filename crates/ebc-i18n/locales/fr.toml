# Used instead of the plain string when the value of the first placeholder starts with a
# vowel sound: « De la part d’Élise ».
[elided]
card_from = "De la part d’{name}"

# Whole-string variants for a tenant's `noun_style`. The default strings above use the
# official noun (« livre numérique ») in running text and the trade noun (« ebook ») in
# the option label.
