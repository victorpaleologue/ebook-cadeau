[package]
name = "ebc-qr"
description = "QR code generation tuned for print: compact payloads, vector output, size rules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ebc-scene.workspace = true
# MIT. Pure Rust, no dependencies, builds for wasm32-unknown-unknown.
qrcodegen = "1.8.0"
thiserror.workspace = true

[dev-dependencies]
# (MIT OR Apache-2.0) AND ISC. Independent decoder for the round-trip tests; the `img`
# feature (and with it the `image` crate) is not needed: bitmaps are fed as closures.
rqrr = { version = "0.11.0", default-features = false }

[lints]
workspace = true
