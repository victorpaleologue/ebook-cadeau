[package]
name = "ebc-server"
description = "eBook Cadeau web service: gifts, redemption, e-reader friendly delivery, partner API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["card"]
# Renders `GET /api/partner/v1/gifts/{id}/card.pdf` with the card composer (`ebc-card`,
# bundled fonts and output profile). Without it the endpoint answers `501` unless the
# embedding application plugs in its own `CardRenderer`.
card = ["dep:ebc-card", "dep:ebc-layout"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "form", "tokio", "original-uri", "matched-path"] }
ebc-card = { workspace = true, optional = true }
ebc-layout = { workspace = true, optional = true }
ebc-i18n.workspace = true
ebc-isbn.workspace = true
ebc-model.workspace = true
hmac = "0.13.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "ring", "smtp-transport", "tokio1", "tokio1-rustls", "webpki-roots"] }
maud = "0.27.0"
percent-encoding = "2.3.2"
rand = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "multipart"] }
roxmltree = "0.21.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.2.1"
tower-http = { version = "0.7.1", features = ["limit", "trace", "fs", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["server", "server-graceful", "http1", "tokio", "service"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[lints]
workspace = true

[[bin]]
name = "ebc-server"
path = "src/main.rs"
# The binary only wires the library to the environment; it has no tests of its own.
test = false
doctest = false

[dev-dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
http-body-util = "0.1.5"
mail-parser = "0.11.9"
png = "0.18"
roxmltree = "0.21.2"
scraper = "0.29.0"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
