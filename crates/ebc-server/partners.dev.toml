# Development partners for `EBC_PARTNERS` — the two fictional demo stores of demo/stores and
# the demo shelf of crates/ebc-shelf (demo — not affiliated). Never use these secrets in production.

[[partners]]
id = "septante"                               # value of X-EBC-Partner
name = "Septante (démo)"                      # shown to recipients
secret = "dev-secret-septante-0123456789"     # signs requests, redirects and webhooks
webhook_url = "http://127.0.0.1:8101/webhooks/ebc"
redirect_hosts = ["127.0.0.1:8101"]           # hosts delivery URLs may point to

[[partners]]
id = "grande-enseigne"
name = "Grande Enseigne (démo)"
secret = "dev-secret-grande-enseigne-0123456789"
webhook_url = "http://127.0.0.1:8102/webhooks/ebc"
redirect_hosts = ["127.0.0.1:8102"]

# The shelf (crates/ebc-shelf): hosts rights holders' own files, registered exactly like a
# store. Its download links are on its own host; no webhook.
[[partners]]
id = "etagere"
name = "Étagère des autrices (démo)"
secret = "dev-secret-etagere-0123456789"
redirect_hosts = ["127.0.0.1:8104"]
