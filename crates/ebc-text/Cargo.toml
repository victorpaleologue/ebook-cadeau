[package]
name = "ebc-text"
description = "Font loading, shaping, measuring, fitting and outlining of text for print."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ebc-scene.workspace = true
# Shaping. Built on `read-fonts`: keep the two in step (harfrust 0.15 needs read-fonts 0.46),
# or the font type of one is not the font type of the other.
harfrust = "0.15"
read-fonts = "0.46"
thiserror.workspace = true
unicode-linebreak = "0.1"
unicode-segmentation = "1"
zeno = { version = "0.3", optional = true }

[lints]
workspace = true

[features]
default = ["raster"]
# `rasterize()`: 8-bit coverage masks of shaped text (used by font identification and previews).
raster = ["dep:zeno"]
