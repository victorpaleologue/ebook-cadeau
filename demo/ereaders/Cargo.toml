[package]
name = "ebc-demo-ereaders"
description = "Demo: simulated e-readers (limited browsers, OPDS client, mail-to-device sink) for integration tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ego-tree = "0.11.1"
html5ever = "0.40.1"
mail-parser = "0.11.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
roxmltree = "0.21.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
scraper = { version = "0.29.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
url = "2.5.8"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
base64 = "0.23.1"
