[package]
name = "ebc-demo-integration"
description = "Demo: the whole constellation in one process (ebc-server, two fictional stores, the fictional printer, simulated e-readers) for end-to-end tests and manual demos."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "ebc-demo"
path = "src/bin/ebc-demo.rs"
# The binary only wires the library to fixed ports; it has no tests of its own.
test = false
doctest = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
axum = "0.8.9"
ebc-demo-ereaders.workspace = true
ebc-demo-printer.workspace = true
ebc-demo-stores.workspace = true
ebc-server.workspace = true
ebc-shelf.workspace = true
serde.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "multipart"] }
ebc-layout.workspace = true
ebc-model.workspace = true
ebc-pdf.workspace = true
ebc-scene.workspace = true
sha2 = "0.11.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
